<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:url("bg.jpg") center center/cover no-repeat;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
}

.login-box{
    position:relative;
    z-index:2;

    width:380px;
    padding:40px;

    border-radius:25px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.3);

    box-shadow:
    0 8px 32px rgba(0,0,0,.35);

    color:white;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
    font-size:35px;
}

.login-box p{
    text-align:center;
    margin-bottom:35px;
    opacity:.8;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.15);

    color:white;

    border:1px solid rgba(255,255,255,.2);

    transition:.3s;
}

.input-box input::placeholder{
    color:#ddd;
}

.input-box input:focus{
    background:rgba(255,255,255,.2);
    border:1px solid white;
}

.remember{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:25px;
}

.remember a{
    color:white;
    text-decoration:none;
}

.remember a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    background:white;
    color:#111;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    background:#f0f0f0;
}

.register{
    margin-top:25px;
    text-align:center;
}

.register a{
    color:white;
    font-weight:bold;
    text-decoration:none;
}

.register a:hover{
    text-decoration:underline;
}


    </style>
</head>
<body>

<div class="overlay"></div>

<div class="login-box">
    <h1>Welcome Back</h1>
    <p>Silahkan login terlebih dahulu</p>

    <div class="input-box">
        <input type="text" placeholder="Username">
    </div>

    <div class="input-box">
        <input type="password" placeholder="Password">
    </div>

    <div class="remember">
        <label>
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button>LOGIN</button>

    <div class="register">
        Belum punya akun?
        <a href="#">Register</a>
    </div>

</div>

</body>
</html>
